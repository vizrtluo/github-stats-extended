name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update-profile-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@7d001ba01225de086e79147f8274b2d2569874d1
        with:
          card: stats
          options: username=luojiyin1987&show_icons=true&include_all_commits=true&show=prs_merged,prs_merged_percentage&title_color=0891b2&text_color=ffffff&icon_color=0891b2&bg_color=1c1917&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.PAT_1 }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@7d001ba01225de086e79147f8274b2d2569874d1
        with:
          card: top-langs
          options: username=luojiyin1987&langs_count=10&title_color=0891b2&text_color=ffffff&bg_color=1c1917&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_1 }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Publish cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="${RUNNER_TEMP}/profile-cards-index"
          rm -f "${GIT_INDEX_FILE}"
          git read-tree --empty
          git add dist/stats.svg dist/top-langs.svg
          tree="$(git write-tree)"
          if git fetch --depth=1 origin profile-cards; then
            previous_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
            test "${tree}" = "${previous_tree}" && exit 0
          fi
          commit="$(printf '%s\n' "chore: update profile cards" | git commit-tree "${tree}")"
          git push --force origin "${commit}:refs/heads/profile-cards"
